schema_version: 1
run_id: null
status: draft
user_goal: "生成指定产品和日期的良率日报。"

constraints:
  spec_source: agent
  spec_builder: rule
  builder_mode: rule
  capability: daily-report
  codex_in_execution_chain: false
  prefer_existing_tools: true
  require_user_confirmation_for_pending_memory: true
  fixed_flow: true

inputs:
  report_date: null
  product_models: []
  date_range:
    start: null
    end: null
  reports:
    - alias: daily_yield
      report_type: daily_yield
      required: true
      filters:
        product_models: []
        end_date: null
    - alias: batch_yield
      report_type: batch_yield
      required: false
      filters:
        product_models: []
        start_date: null
        end_date: null
    - alias: ct_exception
      report_type: ct_exception
      required: false
      filters: {}
    - alias: target_decomposition
      report_type: target_decomposition
      required: false
      filters: {}
    - alias: gap_template
      report_type: gap_template
      required: false
      filters: {}
  local_files:
    - alias: spotfire
      path: resources/spotfire.xlsx
    - alias: daily_yield
      path: resources/V3良率及不良率By月周天汇总报表.xlsx
    - alias: target_decomposition
      path: resources/2026年良率目标拆解-1017版V05 - 无公式版.xlsx
    - alias: ct_exception
      path: resources/CT良率异常波动管理表.xlsx
    - alias: code_mapping
      path: resources/大数据值班当日新增不良HL模板.xlsx

workflow:
  - id: generate_daily_report
    skill: daily_report
    input:
      report_date: null
      product_models: []
      template_ref: docs/project_files/V3良率日报每日异常填报表.xlsx
      sections:
        - gap
        - trend
        - known_exception
        - new_exception
      output_name: null
      emit_intermediate_artifacts: true
    save_as: daily_report_file

outputs:
  daily_report:
    required: true
    format: xlsx
    directory: outputs
    filename_template: "良率日报_{report_date}_{product_models}.xlsx"
  analysis_summary:
    required: true
    format: markdown
  trace:
    required: true
    format: jsonl

memory:
  reuse_policy: confirmed_only
  candidate_policy: record_pending
  allowed_record_ids: []

trace:
  level: step
  include_inputs: true
  include_outputs: true
  include_errors: true
  path: trace.jsonl
