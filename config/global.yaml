# ============================================================
# global.yaml: 全局配置文件
# ============================================================
# 本文件是配置链的基础层，定义所有模块共享的全局设置。
# 覆盖优先级: 默认值 < global.yaml < products/*.yaml < .env
# ============================================================

app_name: "良率日报生成系统"
version: "0.1.0"
debug: false

# ---- 路径配置 ----
paths:
  base_dir: "."                     # 项目根目录
  resources_dir: "resources"        # 源表和模板存放目录
  temp_dir: "data/temp"             # 临时文件目录
  log_dir: "output/logs"            # 日志文件目录（生成物统一进入 output/）
  output_dir: "output"              # 输出文件目录
  template_file: "V3屏体良率日报-A版.xlsx"  # 日报模板文件名
  temp_file: "temp_output.xlsx"     # 临时输出文件名
  output_file: "V3屏体良率日报-output.xlsx"  # 最终输出文件名

# ---- 大模型配置 ----
llm:
  provider: "deepseek"              # 默认供应商: deepseek / gemini
  deepseek:
    base_url: "https://api.deepseek.com"
    model_name: "deepseek-chat"
    timeout: 60
    max_retries: 3
  gemini:
    model_name: "gemini-2.0-flash"
    timeout: 60
    max_retries: 3

# ---- 日志配置 ----
logging:
  level: "INFO"
  domain_rotation: "midnight"
  max_days: 30

# ---- 报告生成配置 ----
report:
  sections:
    - gap_analysis        # 当日Gap解释
    - daily_exception     # 当日异常
    - known_exception     # 已知异常

  gap_analysis:
    top_n: 3                           # Top N Gap
    target_field: "target_defect_rate"
    actual_field: "actual_defect_rate"
    group_field: "group_name"

  batch_analysis:
    min_yield_rate: 30.0               # 最低产出率 % 阈值
    comparison_batches: 3              # 对比的历史批次数量

  trend_analysis:
    consecutive_days: 3
    consecutive_weeks: 3

# ---- Agent Runtime 配置 ----
agent:
  default_runtime: "pydantic_ai"
  daily_report:
    generator_root: "~/.agents/skills/daily-report-generator"
    cli_path: "scripts/daily_report_cli.py"
    output_dir: "output/artifacts/reports/generated"
    generator_root_env: "YIELD_REPORT_DAILY_REPORT_GENERATOR_ROOT"
    workspace_env: "YIELD_REPORT_DUTY_WORKSPACE"
  pydantic_ai:
    enabled: true
    model: "deepseek-chat"
    base_url: "https://api.deepseek.com"
    api_key_env: "DEEPSEEK_API_KEY"
    request_limit: 30
    max_tool_calls: 20
    tool_timeout_seconds:
    require_tool_use_for_workflow: true
  letta:
    enabled: true
    base_url: ""
    api_key_env: "LETTA_API_KEY"
    server_password_env: "LETTA_SERVER_PASSWORD"
    agent_id: ""
    agent_name: "visionox-yield-monitoring-agent"
    agent_id_cache_path: ".agent_workbench/letta_agent_id"
    model: "my-glm-key/glm-5.1"
    embedding: "my-glm-key/text-embedding-3-large"
    sync_memory_blocks: true
    archive_memory_candidates: true
    use_conversations: true
    compaction_mode: "sliding_window"
    compaction_clip_chars: 50000
    compaction_prompt: "Summarize operational context without inventing facts."
    streaming: true
    stream_tokens: false
    background_runs: false
    timeout_seconds: 900
    max_tool_rounds: 20

# ---- 源表文件名校验规则 ----
source_files:
  daily_yield:
    description: "V3CT修正良率及不良率By月周天报表"
    pattern: "V3CT修正良率及不良率By月周天*"
    filename: "V3CT修正良率及不良率By月周天报表.xlsx"
    default_path: "resources/V3CT修正良率及不良率By月周天报表.xlsx"
    purpose: "按日月周维度汇总良率及不良率，用于 Gap 计算"
    source: "FineReport"
    aliases: ["良率日报", "月周天", "daily yield", "V3良率", "良率数据"]
    filters: ["结束日期", "产品型号", "月数"]
    query_guidance:
      - "月数未指定时通常使用 2；最近三个月使用 3"
      - "上午 10 点前日度数据截止昨日，10 点后截止今天"
  batch_yield:
    description: "V3良率及不良率By批次汇总报表"
    pattern: "V3良率及不良率By批次*"
    filename: "V3良率及不良率By批次汇总报表.xlsx"
    purpose: "按批次汇总良率及不良率，用于判断最新批次是否恶化"
    source: "FineReport"
    aliases: ["批次报表", "batch yield", "批次良率", "按批次"]
    filters: ["开始日期", "结束日期", "产品型号"]
    query_guidance:
      - "开始日期默认今天往前 90 天"
      - "上午 10 点前结束日期为昨日，10 点后为今天"
  ct_exception:
    description: "CT异常管理表"
    pattern: "CT良率异常波动管理表*"
    filename: "CT良率异常波动管理表.xlsx"
    default_path: "resources/CT良率异常波动管理表.xlsx"
    purpose: "CT 工程不良率异常波动管理记录"
    source: "网络共享路径"
    aliases: ["CT异常", "异常管理表", "CT良率异常", "异常波动"]
  target_decomposition:
    description: "良率目标拆解表"
    pattern: "*良率目标拆解*"
    filename: "2026年良率目标拆解-1017版V05 - 无公式版.xlsx"
    default_path: "resources/2026年良率目标拆解-1017版V05 - 无公式版.xlsx"
    purpose: "各产品型号的良率目标值拆解"
    source: "本地文件"
    aliases: ["目标拆解", "良率目标", "target", "目标表"]
  gap_template:
    description: "日良率Gap分析模板"
    pattern: "*Gap分析模板*"
    default_path: "docs/project_files/V3良率日报每日异常填报表.xlsx"
    purpose: "Gap 分析规则与模板"
    source: "本地文件"
    aliases: ["Gap模板", "分析模板", "Gap分析模板"]
  spotfire:
    description: "Spotfire 良率分析源表"
    pattern: "spotfire*"
    filename: "spotfire.xlsx"
    default_path: "resources/project_files/spotfire.xlsx"
    purpose: "产品型号与良率分析辅助数据"
    source: "本地文件"
  code_mapping:
    description: "大数据值班当日新增不良 HL 模板"
    pattern: "*当日新增不良HL模板*"
    filename: "大数据值班当日新增不良HL模板.xlsx"
    default_path: "resources/大数据值班当日新增不良HL模板.xlsx"
    purpose: "异常代码映射"
    source: "本地文件"
  data_source_dir:
    description: "良率监控日报自动化共享目录"
    default_path: "//10.71.7.15/大数据共享/12.良率监控日报自动化"
    purpose: "异常监控默认数据目录"
    source: "网络共享路径"
  anomaly_spotfire:
    description: "异常监控 Spotfire 源表"
    filename: "spotfire.xlsx"
    default_path: "D:/wzy/工作-值班工作/相关文件/resources/spotfire.xlsx"
    purpose: "异常监控产品与站点辅助数据"
    source: "本地文件"

# ---- FineReport 下载适配配置（账号、密码等秘密仍只放 .env） ----
report_download:
  finereport:
    report_directory: "目录/良率监控/综合良率"
    labels:
      end_date: "结束日期："
      start_date: "开始日期："
      product_model: "产品型号："
      month_count: "月数："
    report_wait_timeout_ms: 180000
    browser:
      headless: false
      timeout_ms: 120000
      slow_mo_ms: 100
      channel: "chrome"
